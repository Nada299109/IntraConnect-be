name: Deploy — Production

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/,node_modules/,prisma/,package.json"
          target: /var/www/intraconnect/prod

      - name: Write .env, migrate & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /var/www/intraconnect/prod

            cat > .env <<EOF
            NODE_ENV=production
            PORT=3001
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_URL=${{ secrets.PROD_FRONTEND_URL }}
            PWD_MIN_LENGTH=8
            PWD_REQUIRE_UPPER=true
            PWD_REQUIRE_LOWER=true
            PWD_REQUIRE_DIGIT=true
            PWD_REQUIRE_SYMBOL=false
            LOCKOUT_MAX_ATTEMPTS=5
            LOCKOUT_MINUTES=15
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_REGION=${{ secrets.S3_REGION }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_FORCE_PATH_STYLE=false
            S3_SIGNED_URL_TTL=300
            EOF

            npx prisma migrate deploy
            pm2 startOrReload prod.ecosystem.config.js --update-env --time
